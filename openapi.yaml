openapi: 3.0.3
info:
  title: Offhash
  version: 0.1.0
  description: >-
    Hyperledger Fabric personal-data architecture guard. Blocks PD on-chain,
    enforces off-chain stores with salted hash proofs, flags PDC/encrypt anti-patterns.
  x-product-slug: ai-decentralized-offhash
  x-source: ai-in-decentralized+ai/architecturesexplored-gdprv1-181010140325/
servers:
  - url: https://api.example.com
tags:
  - name: Policies
    description: Fabric PD enforcement policies per network version
  - name: Scans
    description: Pre-endorsement proposal field scanning
  - name: HashRecords
    description: Salted on-chain hash registry linked to off-chain PD
  - name: Erasures
    description: Off-chain delete and hash orphanization
  - name: AntiPatterns
    description: PDC, encrypt-on-chain, and cert PD flags
  - name: Reporting
    description: Violation and erasure drill exports
paths:
  /v1/policies:
    get:
      operationId: listFabricPolicies
      tags: [Policies]
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Policies page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeFabricPolicy"
    post:
      operationId: createFabricPolicy
      tags: [Policies]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FabricPolicyCreate"
      responses:
        "201":
          description: Policy created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeFabricPolicy"
  /v1/scans:
    post:
      operationId: scanTransactionProposal
      tags: [Scans]
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProposalScanRequest"
      responses:
        "200":
          description: Scan completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopePdScanResult"
        "422":
          description: PD blocked from chain
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/scans/{scanId}:
    parameters:
      - name: scanId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getScanResult
      tags: [Scans]
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Scan result detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopePdScanResult"
  /v1/hash-records:
    get:
      operationId: listSaltedHashRecords
      tags: [HashRecords]
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - name: status
          in: query
          schema:
            type: string
            enum: [linked, orphaned]
      responses:
        "200":
          description: Hash records page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeSaltedHashRecord"
    post:
      operationId: registerSaltedHash
      tags: [HashRecords]
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaltedHashRegister"
      responses:
        "201":
          description: Hash registered with off-chain link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeSaltedHashRecord"
  /v1/erasures:
    post:
      operationId: executePdErasure
      tags: [Erasures]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ErasureJobCreate"
      responses:
        "202":
          description: Erasure job accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeOrphanizationProof"
  /v1/erasures/{jobId}:
    parameters:
      - name: jobId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getErasureJob
      tags: [Erasures]
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Erasure job status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeOrphanizationProof"
  /v1/anti-patterns:
    get:
      operationId: listAntiPatternFlags
      tags: [AntiPatterns]
      security:
        - BearerAuth: []
      parameters:
        - name: patternType
          in: query
          schema:
            type: string
            enum: [private_data_collection, encrypt_on_chain, client_cert_pd]
      responses:
        "200":
          description: Flagged anti-patterns
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeAntiPatternFlag"
    post:
      operationId: flagAntiPattern
      tags: [AntiPatterns]
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AntiPatternFlagCreate"
      responses:
        "201":
          description: Anti-pattern flagged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeAntiPatternFlag"
  /v1/reports/compliance:
    get:
      operationId: getFabricComplianceReport
      tags: [Reporting]
      security:
        - BearerAuth: []
      parameters:
        - name: period
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Blocked violations and erasure drills
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeFabricComplianceReport"
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
  schemas:
    ResponseMeta:
      type: object
      required: [requestId, timestamp]
      properties:
        requestId: { type: string }
        timestamp: { type: string, format: date-time }
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
    FabricPolicy:
      type: object
      required: [id, fabricVersion, failClosed]
      properties:
        id: { type: string }
        fabricVersion: { type: string }
        failClosed: { type: boolean }
        allowPdcWithBlockToLive: { type: boolean }
        saltRequired: { type: boolean, default: true }
    FabricPolicyCreate:
      type: object
      required: [fabricVersion]
      properties:
        fabricVersion: { type: string }
        failClosed: { type: boolean, default: true }
    ProposalScanRequest:
      type: object
      required: [proposalRef, fields]
      properties:
        proposalRef: { type: string }
        fields:
          type: object
          properties:
            proposalPayload: { type: string }
            clientCertificate: { type: string }
            stateKeys: { type: array, items: { type: string } }
            stateValues: { type: array, items: { type: string } }
            events: { type: array, items: { type: string } }
            chaincodeResponse: { type: string }
    PdScanResult:
      type: object
      properties:
        scanId: { type: string }
        decision: { type: string, enum: [allow, block, remediate] }
        pdFields: { type: array, items: { type: string } }
        remediationHints: { type: array, items: { type: string } }
        endorsementAllowed: { type: boolean }
    SaltedHashRecord:
      type: object
      required: [hashId, saltedHash, offChainStoreRef]
      properties:
        hashId: { type: string }
        saltedHash: { type: string }
        offChainStoreRef: { type: string }
        status: { type: string, enum: [linked, orphaned] }
    SaltedHashRegister:
      type: object
      required: [saltedHash, offChainStoreRef, pdRecordId]
      properties:
        saltedHash: { type: string }
        offChainStoreRef: { type: string }
        pdRecordId: { type: string }
    ErasureJobCreate:
      type: object
      required: [hashId, erasureReason]
      properties:
        hashId: { type: string }
        erasureReason: { type: string }
    OrphanizationProof:
      type: object
      properties:
        jobId: { type: string }
        hashId: { type: string }
        offChainDeleted: { type: boolean }
        orphanedAt: { type: string, format: date-time }
        proofHash: { type: string }
    AntiPatternFlag:
      type: object
      properties:
        id: { type: string }
        patternType: { type: string, enum: [private_data_collection, encrypt_on_chain, client_cert_pd] }
        fabricReference: { type: string }
        compliant: { type: boolean, default: false }
        riskAccepted: { type: boolean }
    AntiPatternFlagCreate:
      type: object
      required: [patternType, proposalRef]
      properties:
        patternType: { type: string }
        proposalRef: { type: string }
        fabricReference: { type: string }
    FabricComplianceReport:
      type: object
      properties:
        period: { type: string }
        proposalsBlocked: { type: integer }
        pdcFlags: { type: integer }
        erasuresCompleted: { type: integer }
        orphanedHashes: { type: integer }
    DataEnvelopeFabricPolicy:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: "#/components/schemas/FabricPolicy" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }
    DataEnvelopePdScanResult:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: "#/components/schemas/PdScanResult" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }
    DataEnvelopeSaltedHashRecord:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: "#/components/schemas/SaltedHashRecord" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }
    DataEnvelopeOrphanizationProof:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: "#/components/schemas/OrphanizationProof" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }
    DataEnvelopeAntiPatternFlag:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: "#/components/schemas/AntiPatternFlag" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }
    DataEnvelopeFabricComplianceReport:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: "#/components/schemas/FabricComplianceReport" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }
    ListEnvelopeFabricPolicy:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [items]
          properties:
            items: { type: array, items: { $ref: "#/components/schemas/FabricPolicy" } }
            nextCursor: { type: string }
        meta: { $ref: "#/components/schemas/ResponseMeta" }
    ListEnvelopeSaltedHashRecord:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [items]
          properties:
            items: { type: array, items: { $ref: "#/components/schemas/SaltedHashRecord" } }
            nextCursor: { type: string }
        meta: { $ref: "#/components/schemas/ResponseMeta" }
    ListEnvelopeAntiPatternFlag:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [items]
          properties:
            items: { type: array, items: { $ref: "#/components/schemas/AntiPatternFlag" } }
            nextCursor: { type: string }
        meta: { $ref: "#/components/schemas/ResponseMeta" }
