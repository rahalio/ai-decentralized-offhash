openapi: 3.1.0
info:
  title: Reporting API
  version: 0.1.0
  description: |
    Fabric compliance summaries and DPIA / counsel export jobs.
  license:
    name: Proprietary
    url: https://offhash.local/license
  x-domain: rpt
servers:
  - url: https://api.offhash.local
    description: Local / starter API
security:
  - bearerAuth: []
  - apiKey: []
tags:
  - name: Reporting
    description: Compliance and DPIA exports
paths:
  /v1/reports/compliance:
    get:
      operationId: getFabricComplianceReport
      tags: [Reporting]
      summary: Synchronous Fabric PD compliance summary
      parameters:
        - name: period
          in: query
          schema:
            type: string
            description: ISO period or preset (e.g. 2026-Q1, last_30d)
        - name: networkId
          in: query
          schema:
            $ref: ./common/primitives.yaml#/components/schemas/NetworkId
      responses:
        '200':
          description: Compliance summary
          content:
            application/json:
              schema:
                $ref: ./reporting.schemas.yaml#/components/schemas/FabricComplianceReportResponse
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem

  /v1/reports/dpia-export:
    post:
      operationId: createDpiaExport
      tags: [Reporting]
      summary: Queue a DPIA / counsel pack export (violations, hash map, drills)
      parameters:
        - $ref: ./common/parameters.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./reporting.schemas.yaml#/components/schemas/DpiaExportCreateRequest
      responses:
        '202':
          description: Export job queued
          content:
            application/json:
              schema:
                $ref: ./reporting.schemas.yaml#/components/schemas/DpiaExportJobResponse
        '400':
          $ref: ./common/responses.yaml#/components/responses/BadRequest
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem

components:
  securitySchemes:
    apiKey:
      $ref: ./common/security.yaml#/components/securitySchemes/apiKey
    bearerAuth:
      $ref: ./common/security.yaml#/components/securitySchemes/bearerAuth
