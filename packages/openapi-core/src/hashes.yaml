openapi: 3.1.0
info:
  title: Hash records API
  version: 0.1.0
  description: |
    Salted on-chain hash registry linked to mutable off-chain personal-data stores.
    Orphan status after erasure proves the hash no longer resolves to live PD.
  license:
    name: Proprietary
    url: https://offhash.local/license
  x-domain: hsh
servers:
  - url: https://api.offhash.local
    description: Local / starter API
security:
  - bearerAuth: []
  - apiKey: []
tags:
  - name: HashRecords
    description: Salted on-chain hash registry
paths:
  /v1/hash-records:
    get:
      operationId: listSaltedHashRecords
      tags: [HashRecords]
      summary: List salted hash records
      parameters:
        - $ref: ./common/parameters.yaml#/components/parameters/Cursor
        - $ref: ./common/parameters.yaml#/components/parameters/Limit
        - name: status
          in: query
          schema:
            type: string
            enum: [linked, orphaned]
        - name: networkId
          in: query
          schema:
            $ref: ./common/primitives.yaml#/components/schemas/NetworkId
        - name: channelId
          in: query
          schema:
            $ref: ./common/primitives.yaml#/components/schemas/ChannelId
      responses:
        '200':
          description: Hash records page
          content:
            application/json:
              schema:
                $ref: ./hashes.schemas.yaml#/components/schemas/SaltedHashRecordListResponse
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem
    post:
      operationId: registerSaltedHash
      tags: [HashRecords]
      summary: Register a salted hash linked to an off-chain PD record
      security:
        - apiKey: []
        - bearerAuth: []
      parameters:
        - $ref: ./common/parameters.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./hashes.schemas.yaml#/components/schemas/SaltedHashRegisterRequest
      responses:
        '201':
          description: Hash registered
          content:
            application/json:
              schema:
                $ref: ./hashes.schemas.yaml#/components/schemas/SaltedHashRecordResponse
        '400':
          $ref: ./common/responses.yaml#/components/responses/BadRequest
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        '409':
          $ref: ./common/responses.yaml#/components/responses/Conflict
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem

  /v1/hash-records/{hashId}:
    get:
      operationId: getSaltedHashRecord
      tags: [HashRecords]
      summary: Get salted hash record by id
      parameters:
        - $ref: ./common/parameters.yaml#/components/parameters/HashIdPath
      responses:
        '200':
          description: Hash record
          content:
            application/json:
              schema:
                $ref: ./hashes.schemas.yaml#/components/schemas/SaltedHashRecordResponse
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        '404':
          $ref: ./common/responses.yaml#/components/responses/NotFound
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem

components:
  securitySchemes:
    apiKey:
      $ref: ./common/security.yaml#/components/securitySchemes/apiKey
    bearerAuth:
      $ref: ./common/security.yaml#/components/securitySchemes/bearerAuth
